<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>低级别球队队徽 · 新旧对照</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#10151b;color:#ecf0f3;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h1{font-size:24px;margin:0 0 8px}p{color:#9eabb8;margin:0 0 18px;line-height:1.7}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{background:#19232d;color:#ccd7e0;padding:8px 13px;border:1px solid #354451;border-radius:6px;cursor:pointer}button.on{background:#295749;border-color:#6ca68d;color:#fff}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:1250px}article{background:#1a222b;border:1px solid #34414e;border-radius:10px;padding:14px;min-width:0}h2{font-size:15px;margin:0 0 4px}.name{font-size:11px;color:#98a9b8;min-height:16px}.pair{display:grid;grid-template-columns:1fr 26px 1fr;align-items:center;text-align:center;margin-top:10px}.pair img{height:70px;width:70px;object-fit:contain;display:inline-block;vertical-align:middle}.pair .crest-plate{background:#f5f1e9;border-radius:50%;padding:2px}.pair small{display:block;color:#94a5b4;font-size:10px;margin:6px 0 0}.arrow{color:#6ba88a;font-size:22px}.tag{color:#86c9a5;font-size:10px;float:right}a{color:#9ab6c8;text-decoration:none;font-size:10px}.foot{margin:10px 0 0;display:flex;justify-content:space-between}#status{margin-top:14px;color:#8fa6b7;font-size:11px}@media(max-width:450px){body{padding:14px}h1{font-size:21px}main{grid-template-columns:1fr}.pair img{height:80px;width:80px}}html.light body{background:#f4f1e9;color:#1c3039}html.light article{background:white;border-color:#c8cdc8}html.light p,html.light .name{color:#506570}
</style></head><body><h1>低级别球队队徽 · 新旧对照</h1><p id="summary">正在加载预览…</p><nav><button class="on" data-filter="all">全部</button><button data-filter="real">真实队徽</button><button data-filter="original">原创精修</button><button data-filter="legacy">旧档球队</button><button id="verify">检查全部队徽</button><button id="theme">切换浅色预览</button></nav><main></main><div id="status"></div><script>
(async()=>{const data=await(await fetch('qa/crest-preview-data.json')).json(),main=document.querySelector('main');document.querySelector('#summary').textContent=`补齐 ${data.real} 支球队真实标识，其中 ${data.legacy} 支为旧档球队；另有 ${data.original} 支采用原创徽章精修。`;
let probe=null;document.querySelector("#verify").onclick=async()=>{const b=document.querySelector("#verify");b.disabled=true;const errors=[];let decoded=0,cursor=0;await Promise.all(Array.from({length:4},async()=>{while(cursor<data.rows.length){const r=data.rows[cursor++];try{const im=new Image();im.src=r.after;await im.decode();if(!im.naturalWidth)throw Error("decode");decoded++;}catch(e){errors.push(r.en+":"+e.message);}}}));probe={total:data.rows.length,decoded,errors};b.disabled=false;};
function render(filter){main.replaceChildren();for(const r of data.rows.filter(r=>filter==='all'||(filter==='legacy'?r.legacy:r.type===filter))){const card=document.createElement('article');const title=document.createElement('h2');title.textContent=r.cn;const tag=document.createElement('span');tag.className='tag';tag.textContent=r.type==='real'?'真实队徽':'原创精修';title.append(tag);const name=document.createElement('div');name.className='name';name.textContent=r.en;const pair=document.createElement('div');pair.className='pair';for(const side of ['before','arrow','after']){const box=document.createElement('div');if(side==='arrow'){box.className='arrow';box.textContent='→';}else{const img=new Image();img.alt=r.cn+(side==='before'?'·原版':'·新版');img.src=r[side];img.loading='lazy';if(side==='after')img.className=r.class;box.append(img);const label=document.createElement('small');label.textContent=side==='before'?'原版':'新版';box.append(label);}pair.append(box);}card.append(title,name,pair);if(r.source){const foot=document.createElement('div');foot.className='foot';const label=document.createElement('span');label.textContent=r.legacy?'旧档兼容补回':'';label.style.cssText='color:#9cabb7;font-size:10px';const link=document.createElement('a');link.href=r.source;link.target='_blank';link.rel='noopener';link.textContent='来源';foot.append(label,link);card.append(foot);}main.append(card);}}
for(const b of document.querySelectorAll('[data-filter]'))b.onclick=()=>{for(const x of document.querySelectorAll('[data-filter]'))x.classList.toggle('on',x===b);render(b.dataset.filter);};document.querySelector('#theme').onclick=()=>document.documentElement.classList.toggle('light');render('all');setInterval(()=>{const imgs=[...document.images],visible=imgs.filter(i=>{const r=i.getBoundingClientRect();return r.width&&r.height&&r.top<innerHeight&&r.bottom>0;});document.querySelector('#status').textContent=JSON.stringify({probe,viewport:{width:innerWidth,height:innerHeight},visible:visible.length,loaded:visible.filter(i=>i.complete&&i.naturalWidth>0).length,broken:imgs.filter(i=>i.complete&&!i.naturalWidth).map(i=>i.alt),overflow:document.documentElement.scrollWidth>innerWidth});},200);
})().catch(e=>document.querySelector('#summary').textContent=e.message);
</script></body></html>

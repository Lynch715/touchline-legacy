<!doctype html><meta charset="utf-8"><title>加载优化功能验收</title>
<script>
(async()=>{
 const html=await(await fetch('../index.html',{cache:'no-store'})).text();
 const sourceSha=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)))].map(b=>b.toString(16).padStart(2,'0')).join('');
 const setup=()=>document.addEventListener('DOMContentLoaded',()=>{
  startMenu=async function(){try{
   newWorld(4242,'Manchester City');SAVE_PAUSED=true;clearTimeout(SAVE_TIMER);VIEW='home';enterGame();fitAppHeight();
   const report=document.createElement('pre');report.id='startup-assets-report';report.style.cssText='position:fixed;bottom:5px;right:5px;z-index:9999;background:var(--bg2);border:1px solid var(--line);padding:6px;font-size:10px;max-width:75vw;white-space:pre-wrap';document.body.appendChild(report);
   function update(){const imgs=[...document.images],visible=imgs.filter(i=>{const r=i.getBoundingClientRect();return r.width&&r.height&&r.bottom>0&&r.right>0&&r.top<innerHeight&&r.left<innerWidth;});report.textContent=JSON.stringify({sourceSha:document.querySelector('meta[name=qa-source-sha]').content,view:VIEW,day:WORLD.day,savePaused:SAVE_PAUSED,images:imgs.length,visible:visible.length,visibleLoaded:visible.filter(i=>i.complete&&i.naturalWidth>0).length,broken:imgs.filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),assetRequests:performance.getEntriesByType('resource').filter(e=>e.name.includes('/assets/images/')).length,overflow:document.documentElement.scrollWidth>innerWidth});}
   setInterval(update,200);update();
  }catch(e){document.body.textContent=e.stack;}};
 });
 document.open();document.write(html.replace('</head>','<base href="../"><meta name="qa-source-sha" content="'+sourceSha+'"><script>('+setup.toString()+')();<\/script></head>'));document.close();
})();
</script>

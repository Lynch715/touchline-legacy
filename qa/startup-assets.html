<!doctype html><meta charset="utf-8"><title>加载优化功能验收</title>
<script>
(async()=>{
 const html=await(await fetch('../index.html',{cache:'no-store'})).text();
 const sourceSha=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)))].map(b=>b.toString(16).padStart(2,'0')).join('');
 const setup=()=>document.addEventListener('DOMContentLoaded',()=>{
  startMenu=async function(){try{
   newWorld(4242,'Manchester City');SAVE_PAUSED=true;clearTimeout(SAVE_TIMER);VIEW='home';enterGame();fitAppHeight();
   const report=document.createElement('pre');report.id='startup-assets-report';report.style.cssText='pointer-events:none;position:fixed;bottom:70px;right:5px;z-index:9999;background:var(--bg2);border:1px solid var(--line);padding:6px;font-size:10px;max-width:75vw;white-space:pre-wrap';document.body.appendChild(report);
   const probe=document.createElement('button');probe.textContent='核验全部图片缓存';probe.style.cssText='position:fixed;bottom:180px;right:5px;z-index:9999;font-size:11px';document.body.appendChild(probe);
   let cacheProbe=null,cacheInfo=null;
   setInterval(async()=>{try{const name='touchline-resources-v1:'+new URL('./',document.baseURI).href,keys=await caches.keys(),store=keys.includes(name)?await caches.open(name):null,files=store?await store.keys():[];cacheInfo={controlled:!!navigator.serviceWorker.controller,worker:navigator.serviceWorker.controller?.scriptURL,name,images:files.filter(r=>r.url.includes('/assets/images/')).length,shell:files.some(r=>r.url.endsWith('/index.html'))};}catch(e){cacheInfo={error:e.message};}},1000);
   probe.onclick=async()=>{probe.disabled=true;try{const manifest=await(await fetch(new URL('assets/manifest.json',document.baseURI))).json(),files=manifest.files.filter(f=>f.path.startsWith('assets/images/'));let cursor=0,decoded=0,errors=[];await Promise.all(Array.from({length:4},async()=>{while(cursor<files.length){const f=files[cursor++];try{const response=await fetch(new URL(f.path,document.baseURI));if(!response.ok)throw Error('http');const blob=await response.blob(),bitmap=await createImageBitmap(blob);if(!bitmap.width)throw Error('decode');bitmap.close();decoded++;}catch(e){errors.push(f.path+':'+e.message);}}}));cacheProbe={total:files.length,decoded,errors};}catch(e){cacheProbe={error:e.message};}probe.disabled=false;update();};
   function update(){const imgs=[...document.images],visible=imgs.filter(i=>{const r=i.getBoundingClientRect();return r.width&&r.height&&r.bottom>0&&r.right>0&&r.top<innerHeight&&r.left<innerWidth;});report.textContent=JSON.stringify({sourceSha:document.querySelector('meta[name=qa-source-sha]').content,viewport:{width:innerWidth,height:innerHeight},view:VIEW,day:WORLD.day,savePaused:SAVE_PAUSED,cacheStatus:RESOURCE_CACHE_STATUS,cacheProbe,cacheInfo,images:imgs.length,visible:visible.length,visibleLoaded:visible.filter(i=>i.complete&&i.naturalWidth>0).length,broken:imgs.filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),assetRequests:performance.getEntriesByType('resource').filter(e=>e.name.includes('/assets/images/')).length,overflow:document.documentElement.scrollWidth>innerWidth});}
   setInterval(update,200);update();
  }catch(e){document.body.textContent=e.stack;}};
 });
 document.open();document.write(html.replace('</head>','<base href="../"><meta name="qa-source-sha" content="'+sourceSha+'"><script>('+setup.toString()+')();<\/script></head>'));document.close();
})();
</script>

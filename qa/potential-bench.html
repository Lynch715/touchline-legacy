<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>年度潜力与替补扩容验收</title>
<style>body{margin:8px;background:#eaf0ec;color:#173b2a;font:13px system-ui}button,select{padding:7px;margin:3px}iframe{display:block;width:100%;height:850px;border:1px solid #81978a;box-sizing:border-box}pre{white-space:pre-wrap;overflow-wrap:anywhere}#wrap{max-width:100%;margin:auto}</style>
<b>本机隔离验收 · 固定种子测试世界 · 暂停存档写入</b><div><button id="club">俱乐部9人替补</button><button id="review">年度评估报告</button><button id="nation">国家队15人替补</button><button id="match">国家队临场换人</button><button id="record">记录验收</button><label>游戏宽度 <select id="width"><option value="100%">全宽</option><option value="390px">390px</option><option value="320px">320px</option></select></label></div><div id="status">正在加载</div><details><summary>验收数据</summary><pre id="report"></pre></details><div id="wrap"><iframe id="game" src="../index.html" title="执掌绿茵测试游戏"></iframe></div>
<script>
const frame=document.getElementById('game'),status=document.getElementById('status'),output=document.getElementById('report');let baseline=null,storageBefore=null,errors=[];
function game(){if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('仅供本机测试');return frame.contentWindow;}
function setup(){const w=game(),s=w.document.createElement('script');s.textContent=`SAVE_PAUSED=true;clearTimeout(SAVE_TIMER);window.qa={P,get WORLD(){return WORLD},get UC(){return UC()},get savePaused(){return SAVE_PAUSED},get rng(){return RNGSTATE},set rng(v){RNGSTATE=v},setScope(v){NAT_SCOPE=v},fixture:null,reset(raw){adoptWorld(JSON.parse(raw));SAVE_PAUSED=true;clearTimeout(SAVE_TIMER);resetMatchSession(true);NAT_SCOPE=null;}};`;w.document.head.appendChild(s);storageBefore=JSON.stringify(w.localStorage);w.newWorld(4242,'Manchester City');baseline=JSON.stringify(w.qa.WORLD);w.addEventListener('error',e=>errors.push(e.message));}
function reset(){if(!baseline)setup();const w=game();w.qa.reset(baseline);for(const p of Object.values(w.qa.WORLD.players)){p.injury=0;p.susp=0;p.condition=100;}w.document.getElementById('loadscr').style.display='none';w.document.getElementById('app').style.display='flex';w.closeModal();return w;}
document.getElementById('club').onclick=()=>{const w=reset();w.autoPickLineup(w.qa.UC);w.go('tactics');status.textContent='俱乐部最多9人，可手动移出和加入替补';};
document.getElementById('review').onclick=()=>{const w=reset(),c=w.qa.UC,ps=c.squad.map(w.qa.P).filter(p=>p.pos!=='GK').sort((a,b)=>a.ca-b.ca).slice(0,4),rows=[];const rng=w.qa.rng,old=w.rnd;try{ps.forEach((p,i)=>{p.age=21;p.prof=i===1?5:15;p.pa=170;p.createdAbs=w.qa.WORLD.season*400+(i===3?232:0);p.development={season:w.qa.WORLD.season,games:38,apps:i===1?0:30,weeks:44,startCA:p.ca-(i===1?0:8)};const before=p.pa;w.rnd=()=>i===2?.9:0;w.prospectFate(p);rows.push(w.developmentReviewRow(p,before));});}finally{w.rnd=old;w.qa.rng=rng;}w.recordDevelopmentReview(c,rows,w.qa.WORLD.season);w.go('training');status.textContent='规则复现场景：上调、下调、维持、暂缓各1人；不是玩家存档';};
function nation(){const w=reset(),E=w.qa.WORLD.nationalCups.NAS,f=E.fixtures[0];w.qa.WORLD.userNation=f.home;w.qa.setScope('nation');w.qa.fixture=f;return w;}
document.getElementById('nation').onclick=()=>{const w=nation();w.go('tactics');status.textContent='国家队26人征召、15名可用替补';};
document.getElementById('match').onclick=()=>{const w=nation(),f=w.qa.fixture;w.qa.WORLD.day=f.day;w.startUserMatch(f);w.subDialog();status.textContent='实际临场换人：替补15人，换人名额仍为5';};
document.getElementById('width').onchange=e=>document.getElementById('wrap').style.width=e.target.value;
document.getElementById('record').onclick=()=>{const w=game(),d=w.document,c=w.qa.UC,n=w.qa.WORLD.userNation,model=n?w.nationalPreview(n):null,r={title:d.title,iframeWidth:frame.getBoundingClientRect().width,viewport:d.documentElement.clientWidth,pageWidth:d.documentElement.scrollWidth,noPageOverflow:d.documentElement.scrollWidth<=d.documentElement.clientWidth,clubBench:c.subs.length,nationalBench:model?.subs.length,roster:n?w.qa.WORLD.nationalTeams[n].players.length:null,review:c.developmentReview||null,savePaused:w.qa.savePaused,localStorageUnchanged:storageBefore===JSON.stringify(w.localStorage),errors};output.textContent=JSON.stringify(r,null,2);output.parentElement.open=true;status.textContent='已记录验收数据';};
frame.onload=()=>status.textContent='已加载，点击场景开始验收';
</script></html>

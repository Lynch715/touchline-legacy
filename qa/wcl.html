<!doctype html><meta charset="utf-8"><title>世冠联赛临场 QA</title>
<script>
(async()=>{
 const html=await(await fetch('../index.html',{cache:'no-store'})).text();
 const setup=()=>document.addEventListener('DOMContentLoaded',()=>{
 const start=startMenu;startMenu=async function(){await start();try{
  newWorld(4242,'Manchester City');SAVE_PAUSED=true;
  const knockout=new URLSearchParams(location.search).get('stage')==='knockout';
  if(knockout){
   while(WORLD.wcl.stage==='G'){
    const E=WORLD.wcl,day=E.gdays.find(d=>WORLD.fixtures.some(f=>f.comp==='WCL'&&f.day===d&&!f.played));WORLD.day=day;
    WORLD.fixtures.filter(f=>f.comp==='WCL'&&f.day===day&&!f.played).forEach(f=>{autoPickLineup(C(f.home));autoPickLineup(C(f.away));applyResult(f,runMatch(createMatch(f.home,f.away,{record:false,...knockoutOpts(f)})))});wclDayEnd(day);
   }
   // Isolated coverage fixture: control a club that actually qualified through the group stage.
   WORLD.userClub=WORLD.wcl.ko.teams[0];
  }else if(!WORLD.wcl.teams.includes(WORLD.userClub))WORLD.userClub=WORLD.wcl.teams[0];
  const fx=WORLD.fixtures.find(f=>f.comp==='WCL'&&!f.played&&(f.home===WORLD.userClub||f.away===WORLD.userClub));WORLD.day=fx.day;
  UC().squad.map(P).forEach(p=>{p.injury=0;p.susp=0;p.condition=100});autoPickLineup(UC());
  const report=document.createElement('script');report.type='application/json';report.id='wcl-report';document.body.appendChild(report);
  function update(){const M=CURMATCH,T=M?.teams[M.userSide];report.textContent=JSON.stringify({knockout,day:WORLD.day,matchDay:fx.day,club:UC().cn,fixture:{stage:fx.stage,played:fx.played,hg:fx.hg,ag:fx.ag,pens:fx.pens,stats:!!fx.stats,players:fx.wclPlayers?.length||0},match:M?{done:M.done,knockout:!!M.knockout,minute:M.t,subs:M.subsMade[M.userSide],mentality:T.tac.mentality}:null})}
  const render0=render;render=function(){render0();update()};const refresh0=refreshMatchUI;refreshMatchUI=function(){refresh0();update()};document.addEventListener('input',()=>setTimeout(update,0));document.addEventListener('click',()=>setTimeout(update,0));
  VIEW='schedule';enterGame();fitAppHeight();
 }catch(e){console.error(e);const x=document.createElement('pre');x.id='wcl-error';x.textContent=e.stack;document.body.appendChild(x)}};
 });
 document.open();document.write(html.replace('</head>','<script>('+setup.toString()+')();<\/script></head>'));document.close();
})();
</script>

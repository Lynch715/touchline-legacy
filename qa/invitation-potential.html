<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国队邀请与多人潜力变化验收</title>
<script>
(async()=>{
 const html=await(await fetch('../index.html',{cache:'no-store'})).text();
 const setup=()=>document.addEventListener('DOMContentLoaded',()=>{
  idbGet=async()=>null;cacheGet=async()=>null;readSaveRecord=async()=>null;healSave=async()=>[];
  storeSave=async()=>{throw Error('QA禁止写入存档');};startResourceCache=()=>{};registerResourceCache=async()=>null;
  startMenu=async()=>{try{
   SAVE_PAUSED=true;newWorld(4242,'Manchester City');adoptWorld(JSON.parse(JSON.stringify(WORLD)));SAVE_PAUSED=true;clearTimeout(SAVE_TIMER);
   const c=UC(),rows=[];seedRng(20261110);
   c.squad.slice(0,28).map(P).forEach((p,i)=>{
    const kind=i<12?0:i<20?1:i<24?2:3;
    Object.assign(p,{age:21,pa:Math.max(p.ca,170),prof:kind===2?5:15,createdAbs:WORLD.season*400+(kind===3?232:0)});
    p.development={season:WORLD.season,games:38,apps:kind===2?0:30,weeks:44,startCA:p.ca-(kind===0?8:kind===1?3:0)};
    const before=p.pa;prospectFate(p);rows.push(developmentReviewRow(p,before));
   });
   recordDevelopmentReview(c,rows,WORLD.season);WORLD.coachRep=90;WORLD.nationInvites=[];
   const oldRandom=Math.random;try{Math.random=()=>.25;genNationalInvites();}finally{Math.random=oldRandom;}
   VIEW='training';enterGame();fitAppHeight();
   const panel=document.createElement('div');panel.style.cssText='position:fixed;z-index:99999;right:4px;bottom:4px;max-width:94vw;padding:6px;background:var(--bg2);border:1px solid var(--line)';
   panel.innerHTML='<div class="hint">固定种子培养样本 · 声望90邀请分支 · 禁止保存</div><button id="qa-review">查看多人潜力评估</button><button id="qa-nation">查看中国队邀请</button>';
   document.body.appendChild(panel);
   const report=document.createElement('script');report.id='qa-report';report.type='application/json';document.body.appendChild(report);
   const record=()=>{report.textContent=JSON.stringify({savePaused:SAVE_PAUSED,coachRep:coachRep(),chinaInvite:WORLD.nationInvites.some(x=>x.nat==='中国'),up:rows.filter(x=>x.result==='up').length,down:rows.filter(x=>x.result==='down').length,stable:rows.filter(x=>x.result==='stable').length,protected:rows.filter(x=>x.result==='observing').length,width:innerWidth,pageWidth:document.documentElement.scrollWidth,rows});};
   document.getElementById('qa-review').onclick=()=>{go('training');record();};
   document.getElementById('qa-nation').onclick=()=>{go('nation');record();};record();
  }catch(e){document.body.innerHTML='<pre id="qa-error"></pre>';document.getElementById('qa-error').textContent=e.stack;}};
 });
 document.open();document.write(html.replace('</head>','<base href="../"><script>('+setup.toString()+')();<\/script></head>'));document.close();
})();
</script>
